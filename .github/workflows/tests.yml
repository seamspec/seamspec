# SeamSpec's own test suite. (The workflow SeamSpec installs into user repos is
# seamspec/templates/seamspec.yml, SPEC §16.5; this is not that file.)
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions minutes are limited on this private repo (ADR-20261007-d757). A new push to a PR cancels
# the run still going for its previous commit; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests: the oldest and newest supported Python. Pushes to main: every version.
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.14"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"  # pinned: a newer uv builds a different package (#96); upgrade on purpose
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # macOS minutes count 10x, so macOS runs only on main, after merge. It isn't part of ci-ok.
  test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"  # pinned: a newer uv builds a different package (#96); upgrade on purpose
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  # Real vitest runs against the pinned fixture install (tests/test_verifier_vitest.py).
  # SEAMSPEC_REQUIRE_VITEST turns a missing install into a failure instead of a skip.
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"  # pinned: a newer uv builds a different package (#96); upgrade on purpose
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix tests/fixtures/ts_repo
      - run: uv sync --locked
      - run: uv run pytest tests/test_verifier_vitest.py
        env:
          SEAMSPEC_REQUIRE_VITEST: "1"

  # SeamSpec governs this repo (ADR-20261006-0f6e): its LOCKED rules also run on every PR,
  # so a commit made with --no-verify, or on another machine, can't slip past them.
  seamspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # doctor --ci compares the ledger with the base branch
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"  # pinned: a newer uv builds a different package (#96); upgrade on purpose
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run seamspec doctor --ci  # forward-only checks + retirement summary in the job summary
      - run: uv run seamspec verify --all --ci

  # One stable check for branch rulesets to require (ADR-20261005-d8bc). The jobs above
  # report one check per OS/Python pair, and those names change whenever the matrix does.
  ci-ok:
    if: always()
    needs: [test, vitest, seamspec]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          test "${{ needs.test.result }}" = "success" &&
          test "${{ needs.vitest.result }}" = "success" &&
          test "${{ needs.seamspec.result }}" = "success"
