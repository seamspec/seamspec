# Publishes SeamSpec to PyPI when a version tag (v0.1.0) is pushed (ADR-20261027-b1a4).
# Pushing the tag is the release: only the owner decides that (ADR-20261005-3adc).
# PyPI trusts this file by name (trusted publishing): no password or token is stored on GitHub.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Build once, from the tagged commit, with the uv the tests use (ADR-20261026-d67b).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # to check that the tag is on main
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"  # pinned: a newer uv builds a different package (#96); upgrade on purpose
          python-version: "3.12"
      - run: uv sync --locked
      - name: The tag matches the code, is on main, and has a dated changelog entry
        run: |
          version="$(uv run python -c 'import seamspec; print(seamspec.__version__)')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME, but the code says $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated entry for $version"; exit 1; }
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only this job can publish. The `pypi` environment is the one PyPI's trusted publisher names;
  # if it requires a reviewer on GitHub, the upload waits for that person's approval.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/seamspec/
    permissions:
      id-token: write  # proves to PyPI that this workflow, in this repository, is uploading
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
      - run: uv publish --trusted-publishing always dist/*
