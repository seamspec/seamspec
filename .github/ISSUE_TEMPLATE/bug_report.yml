name: Bug report
description: Something in SeamSpec doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste messages as text if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SeamSpec version
      description: The output of `seamspec --version`.
      placeholder: seamspec 0.1.0
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor or agent
      multiple: true
      options:
        - Claude Code
        - Cursor
        - VS Code (Copilot)
        - Antigravity
        - None (command line or CI)
        - Other
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: Test runner
      options:
        - pytest
        - vitest
        - Not relevant
  - type: textarea
    id: doctor
    attributes:
      label: Output of `seamspec doctor`
      description: Run it in the project. It checks the setup and doesn't change anything.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
      placeholder: macOS 26, Python 3.12
