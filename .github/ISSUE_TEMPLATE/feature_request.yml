name: Idea or feature request
description: Something SeamSpec should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and where did SeamSpec get in the way or fall short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Your idea, if you have one. A rough sketch is fine.
  - type: input
    id: editor
    attributes:
      label: Editor or agent you use
      placeholder: Claude Code, Cursor, VS Code (Copilot), Antigravity, ...
