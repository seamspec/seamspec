# SeamSpec configuration (SPEC §9.5). Generated by `seamspec init`; commit this file.
schema_version = "1"
mode = "{{mode}}"              # advisory | enforced | strict

[verify]
timeout_seconds = 120          # per runner invocation, never longer than the time left in the deadline
stop_deadline_seconds = 240    # one overall budget for a Stop/gate run; max 270 (the Stop hook timeout is 300)
max_output_chars = 4000        # truncated output fed back to the agent
max_stop_retries = 3           # self-healing ceiling (K); also applies to the error path
run_on_stop = "auto"           # auto | all | scoped
stop_all_threshold = 100       # auto: run all LOCKED below this count, scoped at or above it
isolate_on_failure = 10        # rerun up to N harnesses one at a time when a group can't be attributed

# Runners were generated from the languages detected in this repo (§12A.7).
# v0.1 ships pytest and vitest; jest, go, cargo and custom arrive in v0.2.
{{runners}}

[hooks]
gate_mode = "context"          # context | deny_once | off (§7.2)
{{hooks_extra}}
[protect]
paths = [".seamspec/**"]

[proposals]
max_pending = 10               # project-wide cap on PROPOSED invariants awaiting review

[execution]
run_proposed = "auto"          # auto | host | ask | never (v0.1: auto = host)
env_passthrough = []           # extra env vars tests may see, e.g. ["DATABASE_URL"]
{{execution_extra}}
[review]
{{review_extra}}
[braindump]                    # your scratchpad (§13); git-ignored by default
path = "BRAINDUMP.md"
redact_secrets = true          # mask secret-looking text before it reaches a committed record
nudge = "ask"                  # ask | off: tell the agent about new notes at session start (§13.9)

