# SeamSpec: runs your approved rules on every pull request (SPEC §16.5). Generated by `seamspec init`;
# edit freely. Never switch to pull_request_target: fork PRs must not get secrets or write access.
name: seamspec
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Tests are code from the pull request: don't expose repository secrets to this job.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # doctor --ci compares the ledger with the base branch
      - uses: astral-sh/setup-uv@v6
{{install}}
{{toolchain}}
      - run: seamspec doctor --ci  # rules only move forward; the retirement summary goes to the job summary
      - run: seamspec verify --all --ci  # --ci skips local trust and consent: this workflow is the consent
