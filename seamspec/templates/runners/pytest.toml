[runners.pytest]
# SeamSpec's own pytest.ini and --noconftest: project conftest.py / addopts can't change what a locked test sees (§12.3).
cmd = ["pytest", "-c", ".seamspec/pytest.ini", "--rootdir=.", "--noconftest", "-q", "-p", "no:cacheprovider", "--junitxml={report}", "{each}"]
harness_dir = ".seamspec/tests"
filename = "test_{id}.py"
report = "junit"
config_files = [".seamspec/pytest.ini"]
paths = ["**/*.py"]
